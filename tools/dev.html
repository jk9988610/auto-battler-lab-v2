<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>auto-battler devtool</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; background:#0d0d0f; color:#e6e6e6; margin:0; padding:16px; }
h1 { font-size:16px; color:#c8a15a; margin:0 0 12px; font-weight:600; }
.bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
button { font-size:13px; padding:6px 12px; background:#1c1c20; color:#e6e6e6; border:1px solid #33333a; border-radius:6px; cursor:pointer; }
button:hover { border-color:#c8a15a; background:#2a2a30; }
button.primary { border-color:#3d7d3d; }
button.primary:hover { border-color:#7fd67f; }
button.danger { border-color:#7d3d3d; }
button.danger:hover { border-color:#c66; }
#status { margin-left:auto; color:#666; font-size:12px; padding:4px 10px; border:1px solid #222; border-radius:4px; }
#status.on { color:#7fd67f; border-color:#3d7d3d; }
#status.off { color:#c66; border-color:#7d3d3d; }
#applyBox { margin-bottom:12px; }
#applyBox textarea { width:100%; height:80px; background:#050507; color:#c8a15a; border:1px solid #1e1e22; border-radius:6px; padding:8px; font-family:Consolas,monospace; font-size:12px; resize:vertical; }
#log { background:#050507; color:#7fd67f; border:1px solid #1e1e22; border-radius:6px; padding:10px;
       font-family: Consolas, monospace; font-size:12.5px; line-height:1.5; white-space:pre-wrap;
       height:55vh; overflow-y:auto; }
#log .err { color:#e88; }
#log .ok  { color:#7fd67f; }
#log .dev { color:#666; }
#log .hl  { color:#c8a15a; }
#log .apply { color:#8cf; }
</style>
</head>
<body>
<h1>auto-battler devtool</h1>
<div class="bar">
  <button class="primary" onclick="go('start')">启动服务器</button>
  <button class="danger" onclick="go('stop')">停止</button>
  <button onclick="go('restart')">重启</button>
  <button onclick="go('typecheck')">typecheck</button>
  <button onclick="go('e2e')">跑 e2e</button>
  <button onclick="go('triple')">一键三连</button>
  <button onclick="clearLog()">清日志</button>
  <button onclick="copyLog()">复制日志</button>
  <span id="status">未知</span>
</div>
<div id="applyBox">
  <textarea id="applyText" placeholder="在这里粘贴 文件指令（形如三个尖括号FILE: path 换行 内容 换行 FILE三个大于号），点下方按钮应用"></textarea>
  <div style="margin-top:6px">
    <button onclick="applyText()">应用指令</button>
    <span id="applyMsg" style="margin-left:10px;color:#8cf;font-size:12px"></span>
  </div>
</div>
<div id="log"></div>
<script>
var logEl = document.getElementById('log');
var statusEl = document.getElementById('status');
var applyEl = document.getElementById('applyText');
var applyMsg = document.getElementById('applyMsg');

function append(line){
  var div = document.createElement('div');
  div.textContent = line;
  if (/\[apply\] FAIL/.test(line)) div.className = 'err';
  else if (/\[apply\]/.test(line)) div.className = 'apply';
  else if (/PASS|listening|OK |结束 code=0/.test(line)) div.className = 'ok';
  else if (/ERROR|error|failed|失败|结束 code=[^0]|code=-/.test(line)) div.className = 'err';
  else if (/^\[dev\]/.test(line)) div.className = 'dev';
  else if (/===|REPORT|battle|triple/.test(line)) div.className = 'hl';
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function go(action){
  fetch('/api/' + action, { method: 'POST' }).catch(function(e){ append('err: ' + e.message); });
}
function clearLog(){ logEl.innerHTML = ''; fetch('/api/clear', { method: 'POST' }); }
function copyLog(){
  var lines = [];
  for (var i = 0; i < logEl.children.length; i++) lines.push(logEl.children[i].textContent);
  navigator.clipboard.writeText(lines.join('\n')).then(function(){
    statusEl.textContent = '已复制 ' + lines.length + ' 行';
  }).catch(function(e){ append('复制失败: ' + e.message); });
}
function setStatus(running){
  statusEl.textContent = running ? '服务器运行中' : '服务器已停止';
  statusEl.className = running ? 'on' : 'off';
}
function applyText(){
  var text = applyEl.value || '';
  if (!text.trim()){ applyMsg.textContent = '空内容'; return; }
  applyMsg.textContent = '应用中...';
  fetch('/api/apply', { method: 'POST', body: text }).then(function(r){ return r.json(); }).then(function(d){
    var ok = 0, bad = 0;
    (d.results || []).forEach(function(r){ if (r.ok) ok++; else bad++; });
    applyMsg.textContent = '完成: ' + ok + ' 成功 / ' + bad + ' 失败';
    applyEl.value = '';
  }).catch(function(e){ applyMsg.textContent = '错误: ' + e.message; });
}

var es = new EventSource('/api/stream');
es.onmessage = function(e){
  try {
    var d = JSON.parse(e.data);
    if (d.type === 'log') append(d.line);
    else if (d.type === 'state') setStatus(d.running);
  } catch(err){}
};
fetch('/api/logs').then(function(r){ return r.json(); }).then(function(d){ d.logs.forEach(append); });
fetch('/api/state').then(function(r){ return r.json(); }).then(function(s){ setStatus(s.running); });
</script>
</body>
</html>
